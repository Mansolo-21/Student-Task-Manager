{% extends "base.html" %}
{% load static %}

{% block title %}Home{% endblock %}

{% block content %}

<div class="container-fluid">

    <!-- HEADER ACTION -->
    <div class="d-sm-flex align-items-center justify-content-end mb-4">
        <a href="{% url 'generate_report' %}"
           class="btn btn-sm btn-primary shadow-sm">
            <i class="fas fa-download fa-sm text-white-50"></i>
            Generate Report
        </a>
    </div>

    <!-- WELCOME CARD -->
    <div class="card shadow-lg p-4 border-0 rounded-4 mb-4">

        <h1 class="text-primary fw-bold mb-3">
            Hello {{ user.first_name }}
        </h1>

        <p class="lead text-muted">
            Welcome to the <strong>Student Task Management System</strong>!
        </p>

        <p class="text-secondary">
            This system helps students track assignments, deadlines, and progress in one place.
        </p>

    </div>

    <!-- CHART CARD -->
    <div class="card shadow-lg p-4 border-0 rounded-4">

        <div style="width:100%; max-width:900px; margin:auto;">
            <canvas id="assignmentChart" style="width:100%; height:400px;"></canvas>
        </div>

    </div>

</div>

<!-- CHART.JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const labels = {{ labels|safe }};
const completedData = {{ completed_data|safe }};
const totalData = {{ total_data|safe }};

// Pending = total - completed
const pendingData = totalData.map((t, i) => t - completedData[i]);

// Completion %
const completionRateData = totalData.map((t, i) =>
    t === 0 ? 0 : ((completedData[i] / t) * 100).toFixed(1)
);

if(!labels.length){
    console.error("No chart data found");
} else {

    const ctx = document.getElementById('assignmentChart').getContext('2d');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [

                {
                    label: 'Completed',
                    data: completedData,
                    backgroundColor: 'rgba(40, 167, 69, 0.7)',
                },

                {
                    label: 'Pending',
                    data: pendingData,
                    backgroundColor: 'rgba(220, 53, 69, 0.6)',
                },

                {
                    label: 'Completion Rate (%)',
                    data: completionRateData,
                    type: 'line',
                    borderColor: '#ffc107',
                    backgroundColor: '#ffc107',
                    yAxisID: 'y1',
                    tension: 0.3,
                    fill: false,
                    pointRadius: 5
                }

            ]
        },

        options: {

            responsive: true,

            plugins: {

                title: {
                    display: true,
                    text: 'Weekly Assignment Progress',
                    font: { size: 18, weight: 'bold' }
                },

                legend: {
                    position: 'top'
                },

                tooltip: {
                    callbacks: {
                        label: function(context) {

                            if(context.dataset.label === 'Completion Rate (%)'){
                                return `${context.dataset.label}: ${context.parsed.y}%`;
                            }

                            return `${context.dataset.label}: ${context.parsed.y}`;
                        }
                    }
                }

            },

            scales: {

                x: {
                    stacked: true
                },

                y: {
                    stacked: true,
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: 'Assignments'
                    }
                },

                y1: {
                    position: 'right',
                    beginAtZero: true,
                    max: 100,
                    grid: { drawOnChartArea: false },
                    title: {
                        display: true,
                        text: 'Completion %'
                    }
                }

            }

        }

    });

}

</script>

{% endblock %}
